version: '3.8'

services:
  dailyprophet-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dailyprophet-backend
    ports:
      - "8081:8081"
    env_file:
      - .env
    depends_on:
      - mongodb
      - mydb2
    networks:
      - apps
    restart: unless-stopped

networks:
  apps:
    external: true